# Mu La Ronda - stack en el mismo VPS que Pterodactyl.
#
#   Internet ──443──> nginx del host (el del panel) ──┬── <DOMAIN>        dist/ (estatico)
#                                                     ├── ws.<DOMAIN>     127.0.0.1:PROXY_PORT
#                                                     └── admin.<DOMAIN>  127.0.0.1:ADMIN_PORT
#
#   proxy ──TCP──> openmu (connect 127.0.0.1:44405, game 127.0.0.1:55901-55906)
#
# Todo escucha solo en loopback: los jugadores entran por nginx -> proxy, asi
# que no hay que abrir puertos nuevos ni tocar el firewall. El proxy usa la red
# del host para llegar a 127.0.0.1, que es lo que el cliente espera
# (CONVENTION_CS_HOST en src/common/serverServices.ts).
#
# Ojo con los puertos de Pterodactyl: Wings usa 8080 y 2022, por eso el panel
# de OpenMU va en 8090.

name: mu-la-ronda

# Logs de Docker con rotacion: sin esto cada contenedor guarda todo lo que
# imprime para siempre (/var/lib/docker/containers/*/*-json.log) y OpenMU
# imprime mucho - es una de las formas de llenar el disco.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  database:
    logging: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en deploy/.env}
      POSTGRES_DB: openmu
    # Solo loopback: lo usa el servicio de registro (red del host).
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  # OpenMU con el plugin de escrow del mercado (marketplace/openmu): se compila
  # en el VPS desde un commit fijo de OpenMU con esos archivos encima.
  openmu:
    logging: *logging
    image: mu-la-ronda/openmu-escrow:local
    build:
      context: ../marketplace/openmu
    restart: unless-stopped
    working_dir: /app/
    environment:
      DB_HOST: database
      DB_ADMIN_USER: postgres
      DB_ADMIN_PW: ${DB_PASSWORD}
      ASPNETCORE_URLS: http://+:8080
      OPENMU_ADMIN_USER: ${OPENMU_ADMIN_USER:?falta OPENMU_ADMIN_USER en deploy/.env}
      OPENMU_ADMIN_PASSWORD: ${OPENMU_ADMIN_PASSWORD:?falta OPENMU_ADMIN_PASSWORD en deploy/.env}
      # El mismo que el servicio del mercado: firma los tokens que el plugin acepta.
      MARKETPLACE_ESCROW_SECRET: ${MARKETPLACE_ESCROW_SECRET:?falta MARKETPLACE_ESCROW_SECRET en deploy/.env}
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8090}:8080"
      - "127.0.0.1:44405:44405"
      - "127.0.0.1:44406:44406"
      - "127.0.0.1:55901-55906:55901-55906"
      - "127.0.0.1:55980:55980"
    volumes:
      - adminpanel-keys:/app/data-protection-keys
    depends_on:
      database:
        condition: service_healthy

  proxy:
    logging: *logging
    image: oven/bun:1.2-slim
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    # node_modules lo deja el build del cliente (deploy.sh) en el mismo repo.
    command: ["bun", "run", "proxy/main.ts"]
    environment:
      HOSTNAME: 127.0.0.1
      PORT: ${PROXY_PORT:-3000}
      PRESENCE_PORT: ${PRESENCE_PORT:-3001}
      # Sin esto el proxy es un relay abierto a cualquier host.
      ALLOW_TARGETS: "127.0.0.1:44405,127.0.0.1:55901,127.0.0.1:55902,127.0.0.1:55903,127.0.0.1:55904,127.0.0.1:55905,127.0.0.1:55906"
      TRACK_DB_PATH: /data/track.db
      # Dias de historial en disco (caminar, ataques, skills y exp no se guardan en disco).
      TRACK_RETAIN_DAYS: ${TRACK_RETAIN_DAYS:-7}
      LOG_PACKETS: ${LOG_PACKETS:-off}
      # Mensajes automaticos (mlr.auto_messages, se editan en el panel admin).
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@127.0.0.1:${DB_PORT:-5432}/openmu
    volumes:
      - ..:/app:ro
      - proxydata:/data
    depends_on:
      - openmu

  # Alta de cuentas (register.<DOMAIN>/api/register). Escribe directo en
  # data."Account" de OpenMU. Red del host para ver la IP real del jugador via
  # X-Forwarded-For de nginx (clientIp solo le cree a un peer loopback), que es
  # lo que usa el limite de cuentas por dia.
  register:
    logging: *logging
    image: oven/bun:1.2-slim
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    command: ["bun", "run", "register/server/main.ts"]
    environment:
      HOSTNAME: 127.0.0.1
      PORT: ${REGISTER_PORT:-3100}
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@127.0.0.1:${DB_PORT:-5432}/openmu
      RATE_DB_PATH: /data/signups.sqlite
      RATE_LIMIT: ${REGISTER_RATE_LIMIT:-3}
      CORS_ORIGIN: https://${DOMAIN:?falta DOMAIN en deploy/.env}
    volumes:
      - ..:/app:ro
      - registerdata:/data
    depends_on:
      database:
        condition: service_healthy

  # Mercado (<DOMAIN>/api/market). Sabe quien llama preguntandole al proxy
  # (presence) quien se logueo en ese socket, y lee las cajas de escrow en la
  # base de OpenMU; el item lo mueve el plugin del game server.
  marketplace:
    logging: *logging
    image: oven/bun:1.2-slim
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    command: ["bun", "run", "marketplace/server/main.ts"]
    environment:
      MARKETPLACE_API_HOST: 127.0.0.1
      MARKETPLACE_API_PORT: ${MARKETPLACE_PORT:-3300}
      MARKETPLACE_ESCROW_SECRET: ${MARKETPLACE_ESCROW_SECRET}
      MARKETPLACE_TICKET_SECRET: ${MARKETPLACE_TICKET_SECRET:?falta MARKETPLACE_TICKET_SECRET en deploy/.env}
      MARKETPLACE_CORS_ORIGIN: https://${DOMAIN}
      MARKETPLACE_DB: /data/market.sqlite
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@127.0.0.1:${DB_PORT:-5432}/openmu
      PRESENCE_URL: http://127.0.0.1:${PRESENCE_PORT:-3001}
    volumes:
      - ..:/app:ro
      - marketdata:/data
    depends_on:
      database:
        condition: service_healthy

  # Panel de administracion propio (admin.<DOMAIN>): la pagina la sirve nginx
  # desde dist-admin/, esto es su API. Escribe en la base de OpenMU y habla
  # con Docker (socket) para ver el estado de OpenMU, sus logs y reiniciarlo.
  panel:
    logging: *logging
    image: oven/bun:1.2-slim
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    command: ["bun", "run", "admin/server/main.ts"]
    environment:
      HOSTNAME: 127.0.0.1
      ADMIN_PANEL_PORT: ${ADMIN_PANEL_PORT:-3200}
      # Mismo usuario y clave que el panel de OpenMU (openmu.<DOMAIN>).
      MLR_ADMIN_USER: ${OPENMU_ADMIN_USER:-admin}
      MLR_ADMIN_PASSWORD: ${OPENMU_ADMIN_PASSWORD}
      MLR_ADMIN_SECRET: ${MLR_ADMIN_SECRET:?falta MLR_ADMIN_SECRET en deploy/.env}
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@127.0.0.1:${DB_PORT:-5432}/openmu
      PRESENCE_URL: http://127.0.0.1:${PRESENCE_PORT:-3001}
      # La API de OpenMU (su panel), para cambiar el baul de una cuenta que esta en el juego.
      OPENMU_API_URL: http://127.0.0.1:${ADMIN_PORT:-8090}
      COMPOSE_PROJECT: mu-la-ronda
    volumes:
      - ..:/app:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      database:
        condition: service_healthy

volumes:
  marketdata:
  dbdata:
  adminpanel-keys:
  proxydata:
  registerdata:
