# Mu La Ronda - stack en el mismo VPS que Pterodactyl.
#
#   Internet ──443──> nginx del host (el del panel) ──┬── play.<DOMAIN>   dist/ (estatico)
#                                                     ├── ws.<DOMAIN>     127.0.0.1:PROXY_PORT
#                                                     └── admin.<DOMAIN>  127.0.0.1:ADMIN_PORT
#
#   proxy ──TCP──> openmu (connect 127.0.0.1:44405, game 127.0.0.1:55901-55906)
#
# Todo escucha solo en loopback: los jugadores entran por nginx -> proxy, asi
# que no hay que abrir puertos nuevos ni tocar el firewall. El proxy usa la red
# del host para llegar a 127.0.0.1, que es lo que el cliente espera
# (CONVENTION_CS_HOST en src/common/serverServices.ts).
#
# Ojo con los puertos de Pterodactyl: Wings usa 8080 y 2022, por eso el panel
# de OpenMU va en 8090.

name: mu-la-ronda

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en deploy/.env}
      POSTGRES_DB: openmu
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  openmu:
    image: munique/openmu:${OPENMU_TAG:-latest}
    restart: unless-stopped
    working_dir: /app/
    environment:
      DB_HOST: database
      DB_ADMIN_USER: postgres
      DB_ADMIN_PW: ${DB_PASSWORD}
      ASPNETCORE_URLS: http://+:8080
      OPENMU_ADMIN_USER: ${OPENMU_ADMIN_USER:?falta OPENMU_ADMIN_USER en deploy/.env}
      OPENMU_ADMIN_PASSWORD: ${OPENMU_ADMIN_PASSWORD:?falta OPENMU_ADMIN_PASSWORD en deploy/.env}
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8090}:8080"
      - "127.0.0.1:44405:44405"
      - "127.0.0.1:44406:44406"
      - "127.0.0.1:55901-55906:55901-55906"
      - "127.0.0.1:55980:55980"
    volumes:
      - adminpanel-keys:/app/data-protection-keys
    depends_on:
      database:
        condition: service_healthy

  proxy:
    image: oven/bun:1.2-slim
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    # node_modules lo deja el build del cliente (deploy.sh) en el mismo repo.
    command: ["bun", "run", "proxy/main.ts"]
    environment:
      HOSTNAME: 127.0.0.1
      PORT: ${PROXY_PORT:-3000}
      PRESENCE_PORT: ${PRESENCE_PORT:-3001}
      # Sin esto el proxy es un relay abierto a cualquier host.
      ALLOW_TARGETS: "127.0.0.1:44405,127.0.0.1:55901,127.0.0.1:55902,127.0.0.1:55903,127.0.0.1:55904,127.0.0.1:55905,127.0.0.1:55906"
      TRACK_DB_PATH: /data/track.db
      LOG_PACKETS: ${LOG_PACKETS:-off}
    volumes:
      - ..:/app:ro
      - proxydata:/data
    depends_on:
      - openmu

volumes:
  dbdata:
  adminpanel-keys:
  proxydata:
